[tools]
python = "3.14.7"
node = "24"
uv = "0.12.18"

[settings]
lockfile = true

[tasks.setup]
description = "Install npm and Python dependencies"
run = "npm ci && uv sync --frozen --package codemorph-cli --group dev"

[tasks.check]
description = "Check documentation, TypeScript, Python, and tests"
run = "npm run check"

[tasks.build]
description = "Build the Word Map UI and server"
run = "npm run build"

[tasks.dev]
description = "Start the local Word Map development UI"
run = "npm run dev"
