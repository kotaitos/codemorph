[project]
name = "codemorph-cli"
version = "0.1.0"
description = "Command-line interface for codemorph"
requires-python = ">=3.14,<3.15"
dependencies = ["codemorph-core"]

[project.scripts]
codemorph = "codemorph_cli.main:main"

[tool.uv.sources]
codemorph-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
