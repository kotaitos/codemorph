[project]
name = "codemorph-workspace"
version = "0.1.0"
requires-python = ">=3.14,<3.15"

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true

[tool.uv.workspace]
members = ["core", "cli/python"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.13"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["core/tests", "cli/python/tests"]
