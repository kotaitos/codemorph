[project]
name = "codemorph-core"
version = "0.1.0"
description = "Local Markdown analysis for codemorph"
requires-python = ">=3.14,<3.15"
dependencies = [
  "huggingface-hub>=0.34",
  "markdown-it-py>=4.0",
  "model2vec>=0.9",
  "numpy>=2.3",
  "pathspec>=0.12",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "scikit-learn>=1.7",
  "sudachidict-core>=20250825,<20260723.1",
  "sudachipy>=0.6.11,<0.7",
  "umap-learn>=0.5.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
